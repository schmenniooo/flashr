name: flashr

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flashr
      POSTGRES_PASSWORD: flashr
      POSTGRES_DB: flashr
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashr -d flashr"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    build:
      context: ./infra/ollama
    environment:
      OLLAMA_MODEL: "llama3.2:3b"
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://flashr:flashr@postgres:5432/flashr?sslmode=disable"
      OLLAMA_URL: "http://ollama:11434"
      ALLOWED_ORIGINS: "http://localhost:5173"
      GIN_MODE: "release"
      JWT_SECRET: "dev-secret-change-me-32bytes-minimum-aaaaaa"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  postgres-data:
  ollama-data:
