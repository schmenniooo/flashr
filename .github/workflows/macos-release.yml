name: macOS Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build macOS App
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project ios/flashr.xcodeproj \
            -scheme "flashr (macOS)" \
            -destination 'generic/platform=macOS' \
            -archivePath flashr-macos.xcarchive \
            -xcconfig ios/Config.Release.xcconfig \
            CODE_SIGNING_ALLOWED=NO
        # CODE_SIGNING_ALLOWED=NO: signing is disabled until the Apple Developer
        # Account and certificate secrets are set up. Remove this flag and
        # uncomment the steps below once the account is ready.

      - name: Export .app
        run: |
          xcodebuild -exportArchive \
            -archivePath flashr-macos.xcarchive \
            -exportPath export/ \
            -exportOptionsPlist ios/ExportOptions.plist

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashr-macos-${{ github.ref_name }}
          path: export/

